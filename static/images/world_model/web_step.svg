<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Variant D: the autoregressive next-state predictor"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#767676"/></marker></defs><rect width="900" height="300" fill="#fff"/><rect x="0" y="16" width="212" height="184" rx="6" fill="#eef1f4" stroke="#d9dee5" stroke-width="1.6"/>
<text x="106" y="38" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">State at frame t</text>
<text x="106" y="64" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">object tokens rebuilt from</text>
<text x="106" y="81" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">the current poses and velocities</text>
<text x="106" y="98" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">(plus the last 4 frames)</text>
<text x="106" y="115" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle"></text>
<text x="106" y="132" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">pairwise geometry recomputed</text>
<text x="106" y="149" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">from the current poses</text>
<rect x="242" y="16" width="150" height="184" rx="6" fill="#e8eef9" stroke="#1f6feb" stroke-width="1.6"/>
<text x="317" y="38" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f6feb" text-anchor="middle" dominant-baseline="middle">the same transformer</text>
<text x="317" y="64" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">about 30 tokens</text>
<text x="317" y="81" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">per pass</text>
<rect x="420" y="16" width="226" height="184" rx="6" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="533" y="38" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f6feb" text-anchor="middle" dominant-baseline="middle">Change over one frame</text>
<text x="533" y="64" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">(1/30 s) position change (3),</text>
<text x="533" y="81" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">rotation change (3, axis-angle),</text>
<text x="533" y="98" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">new velocity (3), new spin (3)</text>
<rect x="668" y="16" width="232" height="184" rx="6" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="784" y="38" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f6feb" text-anchor="middle" dominant-baseline="middle">Integrate and repeat</text>
<text x="784" y="64" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">pose(t+1) = pose(t) + change</text>
<text x="784" y="81" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">the new state is the next input</text>
<text x="784" y="98" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">60 passes, then write frames[]</text>
<text x="784" y="115" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">edit any state and continue</text>
<text x="533" y="128" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">frame 15 -&gt; 16, red ball:</text>
<text x="533" y="144" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">moves (+0.065, +0.000, -0.056) m</text>
<text x="533" y="160" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">velocity (1.95, 0.00, -1.53)</text>
<text x="533" y="176" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">      -&gt; (1.95, 0.00, -1.85) m/s</text>
<line x1="216" y1="108" x2="238" y2="108" stroke="#767676" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="396" y1="108" x2="416" y2="108" stroke="#767676" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="650" y1="108" x2="664" y2="108" stroke="#767676" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M784,202 L784,232 L106,232 L106,206" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="446" y="246" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#333" text-anchor="middle" dominant-baseline="middle">repeat for t = 0 ... 59</text>
<text x="450" y="276" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#767676" text-anchor="middle" dominant-baseline="middle">Training: teacher forcing on stored PhysX transitions; noise on the input state and an 8-step unrolled loss keep errors from piling up.</text></svg>
