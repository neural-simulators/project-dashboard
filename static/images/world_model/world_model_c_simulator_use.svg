z
" clip-path="url(#p50294e1142)" style="fill: #4d4d4d; stroke: #4d4d4d; stroke-width: 1.8; stroke-linecap: round"/>
   </g>
   <g id="text_8">
    <text style="font: 700 9.6px 'DejaVu Sans'; text-anchor: start" x="985.43952" y="77.67162" transform="rotate(-0 985.43952 77.67162)">4. Score on the benchmark (PhysX again)</text>
   </g>
   <g id="text_9">
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(985.43952 107.476783)">The frozen evaluator replays the same launch in</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(985.43952 117.401638)">PhysX, probes contacts at the predicted poses</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(985.43952 127.326493)">and checks the goal. One rollout per benchmark</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(985.43952 137.251347)">task: 322 for the dynamic set.</text>
   </g>
   <g id="text_10">
    <text style="fill: #4d4d4d; font: 8.6px 'DejaVu Sans'" transform="translate(19.3104 204.014851)">The 47 seconds per PhysX rollout are paid in step 1, once per training trajectory, and in step 4, once per benchmark task. Training steps and predictions never call the simulator. Red boxes</text>
    <text style="fill: #4d4d4d; font: 8.6px 'DejaVu Sans'" transform="translate(19.3104 213.64497)">use PhysX; blue boxes are the learned model alone.</text>
   </g>
  </g>
