   <g id="text_1">
    <text style="font: 700 15px 'DejaVu Sans'; text-anchor: start" x="19.3104" y="29.170136" transform="rotate(-0 19.3104 29.170136)">C. Where the simulator is used, and where it is not</text>
   </g>
   <g id="text_2">
    <text style="font: 700 9.6px 'DejaVu Sans'; text-anchor: start" x="30.85776" y="77.67162" transform="rotate(-0 30.85776 77.67162)">1. Make training data (PhysX, once)</text>
   </g>
   <g id="text_3">
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(30.85776 107.476783)">Random launches and drops in procedural rooms,</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(30.85776 117.401638)">rolled out in PhysX and stored as trajectories.</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(30.85776 127.326493)">Today 47 s per rollout: a fresh Isaac world,</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(30.85776 137.251347)">3,840 physics steps, a contact read every step.</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(30.85776 147.176202)">Plan: one world per scene, reset in place</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(30.85776 157.101057)">between rollouts.</text>
   </g>
   <g id="patch_6">
    <path d="M 313.842318 119.173697 
Q 323.38982 119.173697 330.924859 119.173697 
" clip-path="url(#p50294e1142)" style="fill: none; stroke: #4d4d4d; stroke-width: 1.8; stroke-linecap: round"/>
    <path d="M 324.524859 115.973697 
L 330.924859 119.173697 
L 324.524859 122.373697 
z
" clip-path="url(#p50294e1142)" style="fill: #4d4d4d; stroke: #4d4d4d; stroke-width: 1.8; stroke-linecap: round"/>
   </g>
   <g id="text_4">
    <text style="font: 700 9.6px 'DejaVu Sans'; text-anchor: start" x="349.05168" y="77.67162" transform="rotate(-0 349.05168 77.67162)">2. Train (no simulator)</text>
   </g>
   <g id="text_5">
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(349.05168 107.476783)">Every training step compares the network's</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(349.05168 117.401638)">output with a stored trajectory. Nothing is</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(349.05168 127.326493)">simulated; a step costs about one second on one</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(349.05168 137.251347)">GPU for a batch of 64 trajectories.</text>
   </g>
   <g id="patch_7">
    <path d="M 632.036238 119.173697 
Q 641.58374 119.173697 649.118779 119.173697 
" clip-path="url(#p50294e1142)" style="fill: none; stroke: #4d4d4d; stroke-width: 1.8; stroke-linecap: round"/>
    <path d="M 642.718779 115.973697 
L 649.118779 119.173697 
L 642.718779 122.373697 
z
" clip-path="url(#p50294e1142)" style="fill: #4d4d4d; stroke: #4d4d4d; stroke-width: 1.8; stroke-linecap: round"/>
   </g>
   <g id="text_6">
    <text style="font: 700 9.6px 'DejaVu Sans'; text-anchor: start" x="667.2456" y="77.67162" transform="rotate(-0 667.2456 77.67162)">3. Predict (no simulator)</text>
   </g>
   <g id="text_7">
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(667.2456 107.476783)">One pass for the regressor, 32 passes for the</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(667.2456 117.401638)">flow model: well under a second per scene. This</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(667.2456 127.326493)">is what would stand in for the simulator.</text>
   </g>
   <g id="patch_8">
    <path d="M 950.230158 119.173697 
Q 959.77766 119.173697 967.312699 119.173697 
" clip-path="url(#p50294e1142)" style="fill: none; stroke: #4d4d4d; stroke-width: 1.8; stroke-linecap: round"/>
