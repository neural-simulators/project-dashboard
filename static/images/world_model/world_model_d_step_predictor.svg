z
" clip-path="url(#pecf28b0284)" style="fill: #4d4d4d; stroke: #4d4d4d; stroke-width: 1.8; stroke-linecap: round"/>
   </g>
   <g id="text_5">
    <text style="fill: #272727; font: 700 9.4px 'DejaVu Sans'" transform="translate(405.412356 124.66084)">the same</text>
    <text style="fill: #272727; font: 700 9.4px 'DejaVu Sans'" transform="translate(398.009856 135.901037)">transformer</text>
    <text style="fill: #272727; font: 700 9.4px 'DejaVu Sans'" transform="translate(388.678887 147.141234)">12 blocks x 512</text>
    <text style="fill: #272727; font: 700 9.4px 'DejaVu Sans'" transform="translate(429.8832 158.381431)"/>
    <text style="fill: #272727; font: 700 9.4px 'DejaVu Sans'" transform="translate(386.904637 169.621628)">about 30 tokens</text>
    <text style="fill: #272727; font: 700 9.4px 'DejaVu Sans'" transform="translate(407.78145 180.861825)">per step</text>
   </g>
   <g id="patch_10">
    <path d="M 526.830404 150.16752 
