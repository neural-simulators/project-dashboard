   </g>
   <g id="text_6">
    <text style="font: 700 9.4px 'DejaVu Sans'; text-anchor: start" x="582.56496" y="82.893731" transform="rotate(-0 582.56496 82.893731)">Change over one frame (1/30 s), per movable object</text>
   </g>
   <g id="text_7">
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(582.56496 110.132814)">position change (3), rotation change (3, axis-</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(582.56496 119.818516)">angle; at most 1.9 rad per frame at the fastest</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(582.56496 129.504217)">measured spin), new velocity (3), new spin (3)</text>
   </g>
   <g id="text_8">
    <text style="font: 7.6px 'DejaVu Sans Mono'" transform="translate(582.56496 172.662227)">frame 15 -&gt; 16, red ball (PhysX truth):</text>
    <text style="font: 7.6px 'DejaVu Sans Mono'" transform="translate(582.56496 181.802534)">  moves by (+0.065, +0.000, -0.056) m</text>
    <text style="font: 7.6px 'DejaVu Sans Mono'" transform="translate(582.56496 190.94284)">  velocity (1.95, 0.00, -1.53)</text>
    <text style="font: 7.6px 'DejaVu Sans Mono'" transform="translate(582.56496 200.083146)">        -&gt; (1.95, 0.00, -1.85) m/s</text>
   </g>
   <g id="patch_11">
    <path d="M 873.250891 150.16752 
Q 885.362963 150.16752 895.462574 150.16752 
" clip-path="url(#pecf28b0284)" style="fill: none; stroke: #4d4d4d; stroke-width: 1.8; stroke-linecap: round"/>
    <path d="M 889.062574 146.96752 
L 895.462574 150.16752 
L 889.062574 153.36752 
z
" clip-path="url(#pecf28b0284)" style="fill: #4d4d4d; stroke: #4d4d4d; stroke-width: 1.8; stroke-linecap: round"/>
   </g>
   <g id="text_9">
    <text style="font: 700 9.4px 'DejaVu Sans'; text-anchor: start" x="916.15536" y="82.893731" transform="rotate(-0 916.15536 82.893731)">Integrate and repeat</text>
   </g>
   <g id="text_10">
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(916.15536 110.132814)">pose(t+1) = pose(t) + change, velocities replaced. The new</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(916.15536 119.818516)">state becomes the next input: 60 passes from the post-launch</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(916.15536 129.504217)">state, then frames[] is written as in the other variants.</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(916.15536 139.189919)">Any state along the way can be edited and the rollout</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(916.15536 148.875621)">continued from it.</text>
   </g>
   <g id="patch_12">
    <path d="M 160.4448 264.924892 
Q 160.4448 252.16864 160.4448 241.42485 
" clip-path="url(#pecf28b0284)" style="fill: none; stroke: #4d4d4d; stroke-width: 1.8; stroke-linecap: round"/>
    <path d="M 157.2448 247.82485 
L 160.4448 241.42485 
L 163.6448 247.82485 
z
" clip-path="url(#pecf28b0284)" style="fill: #4d4d4d; stroke: #4d4d4d; stroke-width: 1.8; stroke-linecap: round"/>
   </g>
   <g id="text_11">
    <text style="fill: #4d4d4d; font: 8.6px 'DejaVu Sans'; text-anchor: middle" x="622.3392" y="257.437389" transform="rotate(-0 622.3392 257.437389)">repeat for t = 0 ... 59</text>
   </g>
   <g id="text_12">
    <text style="fill: #850c0a; font: 700 9.4px 'DejaVu Sans'; text-anchor: start" x="30.85776" y="316.407011" transform="rotate(-0 30.85776 316.407011)">Training: teacher forcing</text>
   </g>
   <g id="text_13">
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(30.85776 342.363054)">Every stored PhysX transition (state t -&gt; state t+1) is one example, so the 60 transitions of a trajectory</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(30.85776 352.048756)">train in parallel. Loss: squared error on the normalised change, objects that stay still weighted 0.1; the</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(30.85776 361.734457)">kinematic-consistency term carries over, and the first-contact head becomes "who touches whom in the next</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(30.85776 371.420159)">frame".</text>
   </g>
   <g id="text_14">
    <text style="fill: #850c0a; font: 700 9.4px 'DejaVu Sans'; text-anchor: start" x="665.96256" y="316.407011" transform="rotate(-0 665.96256 316.407011)">Keeping errors from piling up</text>
   </g>
   <g id="text_15">
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(665.96256 342.363054)">At rollout time the model sees its own slightly wrong states, which it never saw in training. Remedies: (1)</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(665.96256 352.048756)">add small noise to the input state during training so the model learns to pull a drifted state back; (2)</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(665.96256 361.734457)">unroll 8 steps during training and apply the loss to all of them; (3) optional per-step flow head that</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(665.96256 371.420159)">samples the change instead of regressing it, for grazing contacts.</text>
   </g>
   <g id="text_16">
    <text style="fill: #272727; font: 8.6px 'DejaVu Sans'" transform="translate(305.982703 428.49809)">Joint model (B): one sampling run for all 60 frames, pair geometry from frame 0 only, no error pile-up, fixed horizon. Step model (D): 60 passes, pair geometry</text>
    <text style="fill: #272727; font: 8.6px 'DejaVu Sans'" transform="translate(298.869563 438.781674)">recomputed every step so contacts are always current, errors pile up, any horizon, edit the state at any step. Diffusion Forcing sits between them: one network, a</text>
    <text style="fill: #272727; font: 8.6px 'DejaVu Sans'" transform="translate(524.264813 449.065259)">separate noise level per frame, frames denoised in order.</text>
   </g>
  </g>
 </g>
