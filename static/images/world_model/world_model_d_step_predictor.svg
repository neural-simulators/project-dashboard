   <g id="text_1">
    <text style="font: 700 15px 'DejaVu Sans'; text-anchor: start" x="19.3104" y="31.978136" transform="rotate(-0 19.3104 31.978136)">D. The step-by-step alternative: an autoregressive next-step predictor</text>
   </g>
   <g id="text_2">
    <text style="font: 700 9.8px 'DejaVu Sans'; text-anchor: start" x="30.85776" y="83.197669" transform="rotate(-0 30.85776 83.197669)">State at frame t</text>
   </g>
   <g id="text_3">
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(30.85776 110.132814)">N object tokens rebuilt from the current</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(30.85776 119.818516)">state: pose and velocity at frame t plus the</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(30.85776 129.504217)">last 4 frames (60 extra channels); geometry</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(30.85776 139.189919)">and physical channels unchanged. Action token</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(30.85776 148.875621)">(matters only when an intervention is</text>
    <text style="font: 8.1px 'DejaVu Sans'" transform="translate(30.85776 158.561322)">scheduled at this step) and global token.</text>
   </g>
   <g id="text_4">
    <text style="fill: #4d4d4d; font: 8.1px 'DejaVu Sans'" transform="translate(30.85776 193.530414)">Pairwise geometry bias recomputed from the</text>
    <text style="fill: #4d4d4d; font: 8.1px 'DejaVu Sans'" transform="translate(30.85776 203.216116)">current poses at every step, so contact</text>
    <text style="fill: #4d4d4d; font: 8.1px 'DejaVu Sans'" transform="translate(30.85776 212.901817)">proximity is always up to date.</text>
   </g>
   <g id="patch_9">
    <path d="M 308.713291 150.16752 
Q 320.825363 150.16752 330.924974 150.16752 
" clip-path="url(#pecf28b0284)" style="fill: none; stroke: #4d4d4d; stroke-width: 1.8; stroke-linecap: round"/>
