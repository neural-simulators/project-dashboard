<text x="275" y="463" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#767676" text-anchor="start" dominant-baseline="middle">none in the clips</text>
<rect x="590" y="20" width="310" height="36" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="600" y="36" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">The masked flow model</text>
<rect x="590" y="66" width="310" height="40" rx="6" fill="#e8eef9" stroke="#1f6feb" stroke-width="1.3"/>
