<text x="600" y="141" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">the forward question, 15 patches at once</text>
<rect x="590" y="158" width="310" height="40" rx="6" fill="#e8eef9" stroke="#1f6feb" stroke-width="1.3"/>
<text x="600" y="171" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">property tokens and property head</text>
<text x="600" y="187" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">MOVi only: Physion's placeholders stay hidden</text>
<rect x="590" y="204" width="310" height="40" rx="6" fill="#e8eef9" stroke="#1f6feb" stroke-width="1.3"/>
<text x="600" y="217" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">contact head</text>
<text x="600" y="233" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">from the collision events</text>
<rect x="590" y="250" width="310" height="40" rx="6" fill="#fff3d6" stroke="#f5a623" stroke-width="1.3"/>
<text x="600" y="263" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#8a5a00" text-anchor="start" dominant-baseline="middle">end-state input (the cause question)</text>
<text x="600" y="279" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#8a5a00" text-anchor="start" dominant-baseline="middle">learns one answer: nothing was done</text>
<rect x="590" y="296" width="310" height="40" rx="6" fill="#fff3d6" stroke="#f5a623" stroke-width="1.3"/>
