<text x="275" y="233" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">objects at rest; contacts from the collision events</text>
