<text x="275" y="263" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">property head, attribute dropout</text>
<text x="275" y="279" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">on MOVi's masses and two materials only</text>
<rect x="265" y="296" width="310" height="40" rx="6" fill="#e8eef9" stroke="#1f6feb" stroke-width="1.3"/>
<text x="275" y="309" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">recording input (properties from motion)</text>
<text x="275" y="325" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">blocks of the clip's own motion</text>
<rect x="265" y="342" width="310" height="40" rx="6" fill="#fff3d6" stroke="#f5a623" stroke-width="1.3"/>
