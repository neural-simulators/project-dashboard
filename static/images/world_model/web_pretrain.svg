<text x="275" y="401" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#767676" text-anchor="start" dominant-baseline="middle">response to pushes, throws, strikes, pulls</text>
<text x="275" y="417" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#767676" text-anchor="start" dominant-baseline="middle">no clip has an action</text>
