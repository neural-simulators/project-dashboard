<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="What pretraining on MOVi and Physion clips trains in the step-wise regressor and in the masked flow model, and what only our simulations can train"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#767676"/></marker></defs><rect width="900" height="600" fill="#fff"/><rect x="0" y="20" width="230" height="262" rx="6" fill="#e8eef9" stroke="#1f6feb" stroke-width="1.4"/>
<text x="10" y="36" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f6feb" text-anchor="start" dominant-baseline="middle">The clips (3,745)</text>
<text x="10" y="56" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">MOVi-A 1,895, MOVi-B 952, Physion 898</text>
<text x="10" y="71" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">one recording per scene, 1.2 to 3 s</text>
<text x="10" y="86" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle"></text>
<text x="10" y="101" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">every object starts with its recorded</text>
<text x="10" y="116" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">velocity and spin; no action is applied</text>
<text x="10" y="131" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle"></text>
<text x="10" y="146" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">MOVi: mass from density and size,</text>
<text x="10" y="161" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">two materials (friction 0.4 / 0.8,</text>
<text x="10" y="176" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">restitution 0.3 / 0.7)</text>
<text x="10" y="191" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">Physion: masses only; its friction and</text>
<text x="10" y="206" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">restitution are placeholders (hidden)</text>
<text x="10" y="221" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle"></text>
<text x="10" y="236" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">contacts from collision events;</text>
<text x="10" y="251" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">no joints, springs or soft bodies</text>
<text x="0" y="300" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#767676" text-anchor="start" dominant-baseline="middle">what a block learns from them</text>
<rect x="0" y="312" width="14" height="14" rx="3" fill="#e8eef9" stroke="#1f6feb" stroke-width="1.2"/>
<text x="20" y="319" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">trained by the clips</text>
<rect x="0" y="336" width="14" height="14" rx="3" fill="#fff3d6" stroke="#8a5a00" stroke-width="1.2"/>
<text x="20" y="343" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">sees only the zero token</text>
<rect x="0" y="360" width="14" height="14" rx="3" fill="#f4f5f7" stroke="#767676" stroke-width="1.2"/>
<text x="20" y="367" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">untouched: needs our actions</text>
<text x="0" y="396" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">After the clips the networks are fine-tuned</text>
<text x="0" y="410" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">on our simulations (pushes, throws, strikes,</text>
<text x="0" y="424" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">pulls, sweeps of mass, friction and</text>
<text x="0" y="438" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">restitution, removals, mechanisms):</text>
<text x="0" y="452" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">every block then trains.</text>
<text x="0" y="466" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">The co-author's recipe: clips first, then</text>
<text x="0" y="480" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">20,000 steps on our data, 10 to 14% lower</text>
<text x="0" y="494" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">error than from scratch (one-pass models).</text>
<rect x="265" y="20" width="310" height="36" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="275" y="36" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">The step-wise regressor</text>
<rect x="265" y="66" width="310" height="40" rx="6" fill="#e8eef9" stroke="#1f6feb" stroke-width="1.3"/>
<text x="275" y="79" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">object tokens, parts, neighbour geometry</text>
<text x="275" y="95" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">full scene tables, boxes and convex parts</text>
<rect x="265" y="112" width="310" height="40" rx="6" fill="#e8eef9" stroke="#1f6feb" stroke-width="1.3"/>
<text x="275" y="125" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">transformer and block head</text>
<text x="275" y="141" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">falls, slides, bounces and collisions, at speed</text>
<rect x="265" y="158" width="310" height="40" rx="6" fill="#e8eef9" stroke="#1f6feb" stroke-width="1.3"/>
<text x="275" y="171" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">built-in motion</text>
<text x="275" y="187" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">gravity and free rotation; no pendulum or spring in the clips</text>
<rect x="265" y="204" width="310" height="40" rx="6" fill="#e8eef9" stroke="#1f6feb" stroke-width="1.3"/>
