<text x="600" y="325" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#8a5a00" text-anchor="start" dominant-baseline="middle">the zero token: 'no action'</text>
<rect x="590" y="342" width="310" height="40" rx="6" fill="#f4f5f7" stroke="#767676" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="600" y="355" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#767676" text-anchor="start" dominant-baseline="middle">cycle term</text>
<text x="600" y="371" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#767676" text-anchor="start" dominant-baseline="middle">off: no action to replay</text>
<rect x="590" y="388" width="310" height="40" rx="6" fill="#f4f5f7" stroke="#767676" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="600" y="401" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#767676" text-anchor="start" dominant-baseline="middle">which push, throw or strike caused an end</text>
<text x="600" y="417" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#767676" text-anchor="start" dominant-baseline="middle">needs our actions</text>
<rect x="590" y="434" width="310" height="40" rx="6" fill="#f4f5f7" stroke="#767676" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="600" y="447" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#767676" text-anchor="start" dominant-baseline="middle">mechanisms, several actions at once</text>
<text x="600" y="463" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#767676" text-anchor="start" dominant-baseline="middle">none in the clips</text>
<text x="450" y="586" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#767676" text-anchor="middle" dominant-baseline="middle">Blue: the clips train it.  Amber: trained, but only on the no-action token.  Dashed grey: nothing in the clips reaches it.</text></svg>
