<text x="275" y="371" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#8a5a00" text-anchor="start" dominant-baseline="middle">the zero token in every clip</text>
