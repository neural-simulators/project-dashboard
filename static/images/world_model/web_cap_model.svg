<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="The model as it is: one transformer over object, action, global and joint tokens, predicting 0.2 s blocks in a loop"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#767676"/></marker></defs><rect width="900" height="470" fill="#fff"/><rect x="0" y="20" width="215" height="150" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="10" y="36" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">object tokens, one per object</text>
<text x="10" y="56" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">pose, velocity, spin</text>
<text x="10" y="72" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">size, up to 16 convex parts, surface points</text>
<rect x="8" y="84" width="199" height="18" rx="3" fill="#fff3d6" stroke="#f5a623" stroke-width="1.2"/>
<text x="12" y="93" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#8a5a00" text-anchor="start" dominant-baseline="middle">mass, friction, restitution, inertia</text>
<text x="10" y="116" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8a5a00" text-anchor="start" dominant-baseline="middle">the properties, as plain input numbers</text>
<text x="10" y="136" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">flags: dynamic, jointed, pendulum, spring</text>
<text x="10" y="152" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#767676" text-anchor="start" dominant-baseline="middle">static ones and the floor too</text>
<rect x="0" y="182" width="215" height="48" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="10" y="198" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">action token</text>
<text x="10" y="218" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">type, pose, velocity, impulse, force</text>
<rect x="0" y="242" width="215" height="48" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="10" y="258" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">global token</text>
<text x="10" y="278" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">gravity, physics rate, floor material</text>
<rect x="0" y="302" width="215" height="48" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="10" y="318" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">joint tokens</text>
<text x="10" y="338" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">hinge or slider: anchor, axis, stiffness</text>
<rect x="0" y="362" width="215" height="62" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="10" y="378" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">neighbour geometry, per object</text>
<text x="10" y="398" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">gap, contact direction, approach speed,</text>
<text x="10" y="413" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">time to impact for the 8 nearest objects</text>
<line x1="219" y1="149" x2="244" y2="149" stroke="#767676" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="248" y="20" width="170" height="46" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="258" y="36" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">MLP per token kind</text>
<text x="258" y="50" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#767676" text-anchor="start" dominant-baseline="middle">no learned ids: identity is structural</text>
<line x1="333" y1="70" x2="333" y2="90" stroke="#767676" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="248" y="94" width="170" height="110" rx="6" fill="#e8eef9" stroke="#1f6feb" stroke-width="1.4"/>
<text x="258" y="110" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f6feb" text-anchor="start" dominant-baseline="middle">transformer</text>
<text x="258" y="130" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">every token attends</text>
<text x="258" y="145" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">to every other</text>
<text x="258" y="160" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">(8 to 24 layers,</text>
<text x="258" y="175" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">23M to 50M parameters)</text>
<rect x="248" y="232" width="170" height="92" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="258" y="248" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">slot tokens</text>
<text x="258" y="268" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">one per movable object</text>
<text x="258" y="282" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">per 0.2 s block, carrying</text>
<text x="258" y="296" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">the block's start state</text>
<text x="258" y="310" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">and time (t, t²)</text>
<line x1="333" y1="228" x2="333" y2="208" stroke="#767676" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="422" y1="150" x2="446" y2="150" stroke="#767676" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="450" y="20" width="200" height="52" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="460" y="36" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">block head</text>
<text x="460" y="56" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">8 corners, velocity, spin</text>
<text x="460" y="70" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">for the 0.2 s block</text>
<line x1="550" y1="76" x2="550" y2="96" stroke="#767676" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="450" y="100" width="200" height="66" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="460" y="116" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">+ built-in motion</text>
<text x="460" y="136" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">free flight at the centre of mass,</text>
<text x="460" y="150" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">pendulum and spring equations;</text>
<text x="460" y="164" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">the head predicts the correction</text>
<line x1="550" y1="170" x2="550" y2="190" stroke="#767676" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="450" y="194" width="200" height="66" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="460" y="210" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">rules (no training)</text>
<text x="460" y="230" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">exact floor, no new overlap,</text>
<text x="460" y="244" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">objects at rest stay until</text>
<text x="460" y="258" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">something reaches them</text>
<line x1="550" y1="264" x2="550" y2="284" stroke="#767676" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="450" y="288" width="200" height="48" rx="6" fill="#e8eef9" stroke="#1f6feb" stroke-width="1.4"/>
<text x="460" y="304" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f6feb" text-anchor="start" dominant-baseline="middle">state at the end of the block</text>
<text x="460" y="324" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">position, rotation, velocity, spin</text>
<path d="M550,340 L550,442 L110,442 L110,174" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="330" y="456" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">the end state is the next start: 15 blocks make 3 s</text>
<rect x="680" y="20" width="220" height="48" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="690" y="36" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">hold-still head</text>
<text x="690" y="56" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">which objects move at all; the rest are</text>
<text x="690" y="69" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">held exactly in place</text>
<rect x="680" y="80" width="220" height="48" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="690" y="96" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">contact head</text>
<text x="690" y="116" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">which pairs touch, frame by frame</text>
<text x="690" y="129" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">(the only event output today)</text>
<rect x="680" y="140" width="220" height="118" rx="6" fill="#fff" stroke="#d9dee5" stroke-width="1.4"/>
<text x="690" y="156" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333" text-anchor="start" dominant-baseline="middle">training</text>
<text x="690" y="176" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">regression: squared error on each</text>
<text x="690" y="190" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">block against the engine, moving</text>
<text x="690" y="204" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">objects weighted 10x; 5 blocks</text>
<text x="690" y="218" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">chained through its own output;</text>
<text x="690" y="232" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">one pass per block, no noise, no</text>
<text x="690" y="246" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">sampling</text>
<rect x="680" y="270" width="220" height="72" rx="6" fill="#fff3d6" stroke="#f5a623" stroke-width="1.4"/>
<text x="690" y="286" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#8a5a00" text-anchor="start" dominant-baseline="middle">what this cannot do</text>
<text x="690" y="306" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">return a set of answers (one pass,</text>
<text x="690" y="320" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">one answer), or take the end of</text>
<text x="690" y="334" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="middle">the motion as an input</text>
<text x="680" y="362" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#767676" text-anchor="start" dominant-baseline="middle">time enters only as the fraction of</text>
<text x="680" y="376" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#767676" text-anchor="start" dominant-baseline="middle">the 3 s; events enter only through the</text>
<text x="680" y="390" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#767676" text-anchor="start" dominant-baseline="middle">neighbour gaps and times to impact</text>
<text x="680" y="404" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#767676" text-anchor="start" dominant-baseline="middle">read at the start of each block</text></svg>
